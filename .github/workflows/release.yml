name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build
        env:
          QUEUEGLOW_GOOGLE_CLIENT_ID: ${{ vars.QUEUEGLOW_GOOGLE_CLIENT_ID }}

      - name: Create installer and update metadata
        run: npx electron-builder --config scripts/electron-builder.config.cjs --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish one complete release
        shell: pwsh
        run: |
          $assets = Get-ChildItem release/installer -File |
            Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -match '^QueueglowHub-Setup-.*\.exe(\.blockmap)?$' } |
            ForEach-Object { $_.FullName }
          if (-not ($assets | Where-Object { $_ -like '*latest.yml' })) {
            throw 'electron-builder did not produce latest.yml.'
          }
          $packageVersion = node -p "require('./package.json').version"
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$packageVersion" }
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              gh release upload $releaseTag $assets --clobber
            } else {
              Write-Host "Release $releaseTag already exists. Bump package.json to publish a new build."
            }
          } else {
            gh release create $releaseTag $assets --title $releaseTag --notes "Queueglow Hub update. The installer updates existing installations in place."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

